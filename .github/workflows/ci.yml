name: Flutter Calendar App CI/CD (Android Only)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: Code Quality, Linting & Unit/Widget Testing
  # -------------------------------------------------------------
  test_and_analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

  # -------------------------------------------------------------
  # JOB 2: Build Android APK (Main Branch Only)
  # -------------------------------------------------------------
  build_android:
    name: Build Release APK
    needs: test_and_analyze
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # Compiles the Android APK
      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # Saves the generated APK file as a downloadable GitHub artifact
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk